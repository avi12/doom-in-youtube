<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM</title>
    <link rel="stylesheet" href="/vendor/js-dos.css" />
    <script src="/vendor/js-dos.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #stage {
        position: fixed;
        inset: 0;

        /* force the js-dos DOOM canvas to fill the whole surface so every
           thumbnail peephole lands on game pixels, never letterbox black */
        & canvas,
        & .dosbox-container,
        & .dosbox-container > div {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          max-width: none !important;
          max-height: none !important;
          object-fit: fill !important;
          image-rendering: pixelated;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
