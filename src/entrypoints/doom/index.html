<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM</title>
    <link rel="stylesheet" href="/vendor/js-dos.css" />
    <script src="/vendor/js-dos.js"></script>
    <meta name="color-scheme" content="light dark" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #stage {
        position: fixed;
        inset: 0;

        /* the parent sizes #stage to an exact 4:3 rect, so stretch the DOOM canvas to fill it
           (the 320x200 buffer -> 4:3 is the game's authentic pixel-aspect correction) */
        & canvas {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          object-fit: fill !important;
          image-rendering: pixelated;
        }
      }

      /* js-dos overlays its on-screen touch controls and settings sidebar on top of the canvas;
         they are useless here and their white graphics bleed through the thumbnail peepholes */
      main.jsdos-rso :is(.sidebar-slider, .touch) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="stage"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
